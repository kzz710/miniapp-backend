# ⚠️ 此文件用于【还没有域名 / ICP 备案还没通过】的阶段。
# 特点：纯 HTTP、无证书、用 server_name _ 匹配任意 IP / 域名，
#       直接用 http://<公网IP> 即可访问，不会因缺少 SSL 证书导致 nginx -t 失败。
#
# 等【域名 + 备案 + SSL 证书】都齐了，再换用 miniapp.conf（443 + 证书 + 80→443 跳转）。
#
# 部署命令：
#   cp deploy/nginx/miniapp-http-only.conf /etc/nginx/sites-available/miniapp
#   ln -sfn /etc/nginx/sites-available/miniapp /etc/nginx/sites-enabled/miniapp
#   rm -f /etc/nginx/sites-enabled/default     # 避免和默认站点抢 80/default_server
#   nginx -t && systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;

    # ===== H5 静态文件（npm run build:h5 产物放到此目录） =====
    root /opt/miniapp-h5;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;   # SPA 路由刷新回退
    }

    # ===== 后端接口反代（精确匹配，优先级高于上面的 /） =====
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== mytools 静态工具集合（纯静态，无需后端） =====
    # 目录约定：/opt/mytools/<工具名>/index.html；导航页 /opt/mytools/index.html
    # 访问：http://<公网IP>/tools/            → 导航页
    #      http://<公网IP>/tools/createWXscheme/ → 具体工具
    # 注意：createWXscheme 的「复制链接」依赖 HTTPS，此处 http 下手机可能失灵，备案后切 https 即可。
    location /tools/ {
        alias /opt/mytools/;
        index index.html;
    }
}
