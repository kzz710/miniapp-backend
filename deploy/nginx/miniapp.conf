# 部署到 /etc/nginx/sites-available/miniapp 后，软链到 sites-enabled 并 reload。
# ln -s /etc/nginx/sites-available/miniapp /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    # HTTP 强制跳转 HTTPS（备案通过后启用；备案前可注释此行用于 IP/80 调试）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com www.your-domain.com;

    # 腾讯云申请的免费证书（Nginx 格式）解压后上传到此路径
    ssl_certificate     /etc/nginx/ssl/your-domain.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;

    # ===== H5 静态文件（npm run build:h5 产物放到此目录） =====
    root /opt/miniapp-h5;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;   # SPA 路由刷新回退
    }

    # ===== 后端接口反代（精确匹配，优先级高于上面的 /） =====
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
