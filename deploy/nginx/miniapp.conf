# ⚠️ 此文件用于【已有域名 + ICP 已备案 + 已申请 SSL 证书】之后。
#   里面引用了 /etc/nginx/ssl/your-domain.com_* 证书文件；没有域名 / 没证书时
#   nginx -t 会直接报错（证书不存在），且 80 端口强制跳 HTTPS 会导致 IP 无法访问。
#   —— 没有域名 / 未备案，请改用 miniapp-http-only.conf（纯 HTTP，用 IP 直接访问）。
#
# 部署到 /etc/nginx/sites-available/miniapp 后，软链到 sites-enabled 并 reload。
# 记得把下面两处 your-domain.com 改成你的真实域名，并把证书传到对应路径。
# ln -s /etc/nginx/sites-available/miniapp /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    # HTTP 强制跳转 HTTPS（备案通过后启用；备案前可注释此行用于 IP/80 调试）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com www.your-domain.com;

    # 腾讯云申请的免费证书（Nginx 格式）解压后上传到此路径
    ssl_certificate     /etc/nginx/ssl/your-domain.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;

    # ===== H5 静态文件（npm run build:h5 产物放到此目录） =====
    root /opt/miniapp-h5;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;   # SPA 路由刷新回退
    }

    # ===== 后端接口反代（精确匹配，优先级高于上面的 /） =====
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== mytools 静态工具集合（纯静态，无需后端） =====
    # 目录约定：/opt/mytools/<工具名>/index.html；导航页 /opt/mytools/index.html
    # 访问：https://域名.com/tools/            → 导航页
    #      https://域名.com/tools/createWXscheme/ → 具体工具
    location /tools/ {
        alias /opt/mytools/;
        index index.html;
    }
}
