# ⚠️ 此文件为【域名 + ICP 已备案 + 已申请 SSL 证书】后的 HTTPS 完整版。
#   域名已填写：kzzmyself.cn（含 www.kzzmyself.cn）；证书按腾讯云 Nginx 格式命名：
#     /etc/nginx/ssl/kzzmyself.cn_bundle.crt
#     /etc/nginx/ssl/kzzmyself.cn.key
#   若你下载的证书文件名不同，只改下面第 23-24 行即可。
#   没有域名 / 未备案，请改用 miniapp-http-only.conf（纯 HTTP，用 IP 直接访问）。
#
# 部署：cp 到 /etc/nginx/sites-available/miniapp，软链到 sites-enabled，再 reload。
#   ln -sfn /etc/nginx/sites-available/miniapp /etc/nginx/sites-enabled/miniapp
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name kzzmyself.cn www.kzzmyself.cn;
    # HTTP 强制跳转 HTTPS（备案通过后启用；备案前可注释此行用于 IP/80 调试）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kzzmyself.cn www.kzzmyself.cn;

    # 腾讯云申请的免费证书（Nginx 格式）解压后上传到此路径
    ssl_certificate     /etc/nginx/ssl/kzzmyself.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/kzzmyself.cn.key;

    # ===== H5 静态文件（npm run build:h5 产物放到此目录） =====
    root /opt/miniapp-h5;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;   # SPA 路由刷新回退
    }

    # ===== 后端接口反代（精确匹配，优先级高于上面的 /） =====
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== mytools 静态工具集合（纯静态，无需后端） =====
    # 目录约定：/opt/mytools/<工具名>/index.html；导航页 /opt/mytools/index.html
    # 访问：https://kzzmyself.cn/tools/            → 导航页
    #      https://kzzmyself.cn/tools/createWXscheme/ → 具体工具
    location /tools/ {
        alias /opt/mytools/;
        index index.html;
    }
}
